<ion-content [fullscreen]="true" class="pawrescue-home">
  <main class="home-container">

    <!-- Brand header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <ion-icon name="paw"></ion-icon>
        </div>
        <div class="brand-copy">
          <h2>PawConnect</h2>
          <p>Community</p>
        </div>
      </div>

      <!-- Notifications -->
      <button
        class="profile-button"
        type="button"
        aria-label="Open notifications"
        title="Notifications"
        (click)="openNotifications()">
        <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <!-- Welcome banner -->
    <section class="welcome-card" aria-labelledby="welcome-heading">
      <div class="welcome-card-content">
        <div class="welcome-topline">
          <span class="welcome-label">PAWCONNECT COMMUNITY</span>
          <span class="welcome-paw" aria-hidden="true">
            <ion-icon name="paw"></ion-icon>
          </span>
        </div>
        <h1 id="welcome-heading">Welcome to PawConnect!</h1>
        <p>Together, we can help pets find safety, care, and loving homes.</p>
      </div>
    </section>

    <!-- Community services -->
    <section class="services-section" aria-labelledby="services-heading">
      <div class="section-heading">
        <span class="section-eyebrow">EXPLORE PAWCONNECT</span>
        <h2 id="services-heading">How can we help today?</h2>
        <p>Explore our community services</p>
      </div>

      <!-- Lost and Found Pets -->
      <button
        class="feature-card"
        type="button"
        (click)="openFeature('lost-found')"
        aria-label="Open Lost and Found Pets">
        <span class="feature-icon lost" aria-hidden="true">
          <ion-icon name="search-outline"></ion-icon>
        </span>
        <span class="feature-content">
          <span class="feature-title">Lost and Found Pets</span>
          <span class="feature-description">
            Report missing pets or help reunite found pets with their owners.
          </span>
        </span>
        <span class="feature-arrow" aria-hidden="true">
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </span>
      </button>

      <!-- Pet Adoption -->
      <button
        class="feature-card"
        type="button"
        (click)="openFeature('adoption')"
        aria-label="Open Pet Adoption">
        <span class="feature-icon adoption" aria-hidden="true">
          <ion-icon name="heart-outline"></ion-icon>
        </span>
        <span class="feature-content">
          <span class="feature-title">Pet Adoption</span>
          <span class="feature-description">
            Browse pets available for adoption and give them a loving home.
          </span>
        </span>
        <span class="feature-arrow" aria-hidden="true">
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </span>
      </button>

    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <div class="bottom-nav-inner">
      <button class="nav-item active" type="button" aria-current="page">
        <ion-icon name="home-outline" aria-hidden="true"></ion-icon>
        <span>Home</span>
      </button>

      <button class="nav-item" type="button" (click)="openReports()">
        <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
        <span>My Reports</span>
      </button>

      <button class="nav-item" type="button" (click)="openAccount()">
        <ion-icon name="person-circle-outline" aria-hidden="true"></ion-icon>
        <span>My Account</span>
      </button>
    </div>
  </nav>
</ion-content>
