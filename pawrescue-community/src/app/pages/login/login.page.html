<ion-content class="login-page" [fullscreen]="true" [scrollY]="false">
  <main class="login-container">
    <section class="form-panel" aria-labelledby="login-title">

      <!-- Decorative shapes inspired by the reference design. -->
      <div class="card-bottom-wave" aria-hidden="true"></div>

      <!-- PawConnect logo -->
      <div class="login-logo">
        <img
          src="assets/images/pawrescue-logo.png"
          alt="PawConnect logo"
          width="210"
          height="156"
        />
      </div>

      <!-- Short, warm message -->
      <div class="form-heading">
        <h2 id="login-title">Every paw matters.</h2>
        <p>Helping pets find safety and loving homes.</p>
      </div>

      <!-- Existing authentication bindings preserved -->
      <form class="login-form" (ngSubmit)="login()">
        <div class="field-group">
          <ion-input
            class="auth-input"
            label="Email or Username"
            label-placement="floating"
            fill="outline"
            type="text"
            name="loginInput"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            [disabled]="loading"
            [(ngModel)]="loginInput">
          </ion-input>
        </div>

        <div class="field-group password-group">
          <ion-input
            class="auth-input"
            label="Password"
            label-placement="floating"
            fill="outline"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            [disabled]="loading"
            [(ngModel)]="password">
          </ion-input>

          <button
            class="password-toggle"
            type="button"
            [disabled]="loading"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <p class="error" *ngIf="errorMessage" role="alert" aria-live="polite">
          {{ errorMessage }}
        </p>

        <ion-button
          class="login-button"
          expand="block"
          type="submit"
          [disabled]="loading">
          <ion-spinner
            *ngIf="loading"
            name="crescent"
            aria-label="Signing in">
          </ion-spinner>
          <span *ngIf="!loading">Log In</span>
          <span *ngIf="loading" class="loading-label">Signing in...</span>
        </ion-button>
      </form>

      <div class="register-section">
        <p class="register-text">
          New to PawConnect?
          <a routerLink="/register">Create an account</a>
        </p>
      </div>

      <p class="auth-footnote">One community. More happy reunions.</p>
    </section>
  </main>
</ion-content>
